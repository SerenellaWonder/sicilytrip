services:
  postgres:
    image: postgres:16
    container_name: sls_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sls
      POSTGRES_PASSWORD: sls
      POSTGRES_DB: sls_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sls_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

